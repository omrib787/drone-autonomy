<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" font-family="Helvetica, Arial, sans-serif">
  <title>ArduPilot Quad X motor layout, seen from above, front at the top</title>
  <rect width="320" height="320" fill="#ffffff"/>
  <polygon points="160,14 150,30 170,30" fill="#444444"/>
  <text x="160" y="46" text-anchor="middle" font-size="12" fill="#444444" letter-spacing="2">FRONT</text>
  <line x1="82" y1="100" x2="238" y2="256" stroke="#b4bec2" stroke-width="7" stroke-linecap="round"/>
  <line x1="238" y1="100" x2="82" y2="256" stroke="#b4bec2" stroke-width="7" stroke-linecap="round"/>
  <rect x="138" y="156" width="44" height="44" rx="3" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
  <polygon points="160,162 153,174 167,174" fill="#444444"/>
  <g>
    <circle cx="238" cy="100" r="42" fill="none" stroke="#0e6c75" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="238" cy="100" r="14" fill="#e3e9ea" stroke="#444444" stroke-width="1.5"/>
    <text x="238" y="106" text-anchor="middle" font-size="18" font-weight="bold" fill="#141a1e">1</text>
    <text x="238" y="158" text-anchor="middle" font-size="12" fill="#0e6c75">CCW · test A</text>
  </g>
  <g>
    <circle cx="82" cy="256" r="42" fill="none" stroke="#0e6c75" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="82" cy="256" r="14" fill="#e3e9ea" stroke="#444444" stroke-width="1.5"/>
    <text x="82" y="262" text-anchor="middle" font-size="18" font-weight="bold" fill="#141a1e">2</text>
    <text x="82" y="206" text-anchor="middle" font-size="12" fill="#0e6c75">CCW · test C</text>
  </g>
  <g>
    <circle cx="82" cy="100" r="42" fill="none" stroke="#2c6742" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="82" cy="100" r="14" fill="#e3e9ea" stroke="#444444" stroke-width="1.5"/>
    <text x="82" y="106" text-anchor="middle" font-size="18" font-weight="bold" fill="#141a1e">3</text>
    <text x="82" y="158" text-anchor="middle" font-size="12" fill="#2c6742">CW · test D</text>
  </g>
  <g>
    <circle cx="238" cy="256" r="42" fill="none" stroke="#2c6742" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="238" cy="256" r="14" fill="#e3e9ea" stroke="#444444" stroke-width="1.5"/>
    <text x="238" y="262" text-anchor="middle" font-size="18" font-weight="bold" fill="#141a1e">4</text>
    <text x="238" y="206" text-anchor="middle" font-size="12" fill="#2c6742">CW · test B</text>
  </g>
  <text x="160" y="312" text-anchor="middle" font-size="11" fill="#545e66">Number = Matek output S1-S4 · CW = clockwise</text>
</svg>
